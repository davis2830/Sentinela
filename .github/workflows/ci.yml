name: Sentinel NOC - CI & DevSecOps Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # 1. FRONTEND QUALITY & BUILD VERIFICATION
  # -------------------------------------------------------------
  frontend:
    name: Frontend Quality & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Guard versionable files and secrets
        run: |
          npm run test:repo-guard
          npm run check:repo
          node --test ../scripts/release-gate.test.mjs

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Lint and generated API contracts
        run: |
          npm run lint
          npm run format:check
          npm run check:api

      - name: Verify TCP IPv6 endpoint serialization
        run: npm run test:network-endpoint

      - name: Production Bundle Build
        run: npm run build

      - name: DevSecOps - NPM Security Audit
        run: npm audit --omit=dev --audit-level=high

  # -------------------------------------------------------------
  # 2. BACKEND QUALITY & UNIT TESTS
  # -------------------------------------------------------------
  backend:
    name: Backend Tests & Quality Assurance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinel_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements/base.txt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev whois openssl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/base.txt
          pip install -c backend/requirements/constraints.txt flake8 pytest pytest-django
          pip install -r backend/requirements/quality.txt

      - name: Ruff Python quality
        run: |
          ruff check backend
          ruff format --check backend/common/authorization.py backend/common/error_handler.py backend/common/contracts.py backend/common/pagination.py backend/common/tests_quality.py backend/common/tests_quality_migrations.py backend/common/tests_quality_contracts.py backend/users/authorization.py backend/users/authorization_views.py backend/users/management/commands/seed_quality_audit.py backend/organizations/plans.py backend/organizations/catalog_views.py backend/organizations/member_directory.py backend/notifications/transports.py backend/alerts/evaluators.py

      - name: Linting & Flake8 Style Check
        run: flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Senti9 Agent Tests
        run: |
          bash -n sentinine/install.sh
          docker build --target tests -t senti9-tests:ci sentinine
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=128m --cap-drop ALL --security-opt no-new-privileges:true senti9-tests:ci

      - name: Build Senti9 runtime
        run: docker build --target production -t senti9-runtime:ci sentinine

      - name: Verify Senti9 runs without privileges
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges:true --pids-limit 128 --memory 256m
          senti9-runtime:ci python -c
          "import os; from delivery import Journal; assert os.getuid()==10001;
          Journal('/data/ci.sqlite3'); assert os.statvfs('/app').f_flag & os.ST_RDONLY"

      - name: Run Django Tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          SECRET_KEY: ci-secret-key-for-testing-only-1234567890
          DEBUG: "False"
          POSTGRES_DB: sentinel_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
        run: |
          cd backend
          python manage.py document_contracts api > /tmp/sentinel-reference-api.json
          python -c 'import json; from pathlib import Path; assert json.loads(Path("../docs/reference-api.json").read_text(encoding="utf-8")) == json.loads(Path("/tmp/sentinel-reference-api.json").read_text(encoding="utf-8")), "Regenera docs/reference-api.json con document_contracts api"'
          python manage.py test

  # -------------------------------------------------------------
  # 3. DEVSECOPS & DEPENDENCY VULNERABILITY SCANNING
  # -------------------------------------------------------------
  devsecops:
    name: DevSecOps Vulnerability & Image Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python for Security Audits
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run Pip-Audit (Dependency Vulnerabilities)
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements/base.txt --desc

      - name: Scan Dockerfile with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  infrastructure:
    name: Production Compose & Nginx Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare ephemeral TLS fixtures
        run: |
          mkdir -p .ci-tls
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout .ci-tls/tls.key -out .ci-tls/tls.crt -subj "/CN=localhost"
          # Only this disposable test key; real TLS keys require group 101 / 0440.
          chmod 644 .ci-tls/tls.key

      - name: Validate production Compose
        env:
          BACKEND_IMAGE: ghcr.io/example/sentinel/backend
          FRONTEND_IMAGE: ghcr.io/example/sentinel/frontend
          GATEWAY_IMAGE: ghcr.io/example/sentinel/gateway
          IMAGE_TAG: test
          SECRET_KEY: ci-secret-key-with-more-than-fifty-characters-123456789
          ALLOWED_HOSTS: localhost
          CORS_ALLOWED_ORIGINS: https://localhost
          CSRF_TRUSTED_ORIGINS: https://localhost
          POSTGRES_PASSWORD: ci-database-password
          REDIS_PASSWORD: ci-redis-password
          TLS_CERT_PATH: ./.ci-tls/tls.crt
          TLS_KEY_PATH: ./.ci-tls/tls.key
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Build production images
        run: |
          docker build -t sentinel-backend-ci ./backend
          docker build -f frontend/Dockerfile.prod -t sentinel-frontend-ci ./frontend
          docker build -t sentinel-gateway-ci ./docker/nginx

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: sentinel-backend-ci
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: sentinel-frontend-ci
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Validate gateway Nginx configuration
        run: |
          docker run --rm \
            --add-host backend:127.0.0.1 \
            --add-host frontend:127.0.0.1 \
            -v "$PWD/.ci-tls:/etc/nginx/tls:ro" \
            sentinel-gateway-ci nginx -t

      - name: Scan gateway image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: sentinel-gateway-ci
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Verify production-shaped startup and recovery
        run: |
          docker tag sentinel-backend-ci sentinel-audit-backend:local
          docker tag sentinel-frontend-ci sentinel-audit-frontend-prod:local
          docker tag sentinel-gateway-ci sentinel-audit-gateway:local
          mkdir -p .tmp/audit-tls
          cp .ci-tls/tls.crt .ci-tls/tls.key .tmp/audit-tls/
          docker compose --env-file .env.production.example -p sentinel-prod-ci -f docker-compose.prod.yml -f docker-compose.audit.prod.yml run --rm backend python manage.py migrate --noinput
          docker compose --env-file .env.production.example -p sentinel-prod-ci -f docker-compose.prod.yml -f docker-compose.audit.prod.yml up -d backend celery_worker frontend nginx
          bash scripts/smoke-production.sh sentinel-prod-ci

      - name: Stop production-shaped fixture
        if: always()
        run: docker compose --env-file .env.production.example -p sentinel-prod-ci -f docker-compose.prod.yml -f docker-compose.audit.prod.yml down -v

  e2e:
    name: Playwright Critical Flows
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start isolated application fixture
        run: |
          docker compose up -d --build db redis backend frontend
          docker compose exec -T backend python manage.py migrate --noinput
          docker compose exec -T -e SENTINEL_E2E_FIXTURE=1 backend python manage.py seed_e2e_accounts --suffix ci-beta-fixture
          docker compose up -d --build celery_worker

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser fixture
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for services
        run: |
          for attempt in {1..30}; do
            echo "Waiting for isolated services ($attempt/30)"
            curl --fail http://127.0.0.1:8000/health/ && curl --fail http://127.0.0.1:3001/ && exit 0
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Run Playwright
        working-directory: frontend
        env:
          E2E_FIXTURE_SUFFIX: ci-beta-fixture
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Stop isolated fixture
        if: always()
        run: docker compose down -v
