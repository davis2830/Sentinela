name: Sentinel NOC - CD Production Deployment Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  # -------------------------------------------------------------
  # 1. BUILD & PUBLISH IMMUTABLE CONTAINER IMAGES
  # -------------------------------------------------------------
  build-and-publish:
    name: Build & Push Production Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags & Labels)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Extract Metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # 2. CONTROLLED CUTOVER DEPLOYMENT
  # -------------------------------------------------------------
  deploy:
    name: Deploy to Production Environment
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sentinel-noc.company.com
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Deployment Scripts & Compose
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.PROD_SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_SERVER_USER }}
          PUBLIC_HEALTHCHECK_URL: ${{ secrets.PROD_HEALTHCHECK_URL }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_SSH_HOST"
          test -n "$DEPLOY_USER"
          test -n "$PUBLIC_HEALTHCHECK_URL"

      - name: Setup SSH Deploy Key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.PROD_SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Execute controlled production cutover
        env:
          DEPLOY_SSH_HOST: ${{ secrets.PROD_SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_SERVER_USER }}
          PUBLIC_HEALTHCHECK_URL: ${{ secrets.PROD_HEALTHCHECK_URL }}
        run: |
          DEPLOY_IMAGE_TAG="sha-${GITHUB_SHA:0:7}"
          ssh "$DEPLOY_USER@$DEPLOY_SSH_HOST" "PUBLIC_HEALTHCHECK_URL='$PUBLIC_HEALTHCHECK_URL' DEPLOY_IMAGE_TAG='$DEPLOY_IMAGE_TAG' bash -s" << 'EOF'
            set -Eeuo pipefail
            cd /opt/sentinel-noc
            set -a
            . ./.env
            set +a
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -p backups
            previous_tag="$IMAGE_TAG"

            docker compose -f docker-compose.prod.yml exec -T db \
              pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB" | gzip > "backups/sentinel-$stamp.sql.gz"

            rollback() {
              echo "Deployment failed; rolling application images back to $previous_tag"
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$previous_tag/" .env
              export IMAGE_TAG="$previous_tag"
              docker compose -f docker-compose.prod.yml up -d --remove-orphans
              if [ "${MIGRATION_IRREVERSIBLE:-false}" = "true" ]; then
                echo "Irreversible migration declared; restoring the pre-deploy database backup"
                gunzip -c "backups/sentinel-$stamp.sql.gz" | docker compose -f docker-compose.prod.yml exec -T db \
                  psql -U "$POSTGRES_USER" "$POSTGRES_DB"
              fi
            }
            trap rollback ERR

            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$DEPLOY_IMAGE_TAG/" .env
            export IMAGE_TAG="$DEPLOY_IMAGE_TAG"
            docker compose -f docker-compose.prod.yml pull

            echo "Starting documented cutover window"
            docker compose -f docker-compose.prod.yml stop nginx backend celery_worker celery_beat
            docker compose -f docker-compose.prod.yml run --rm backend python manage.py migrate --noinput
            docker compose -f docker-compose.prod.yml run --rm backend \
              python manage.py quarantine_unsafe_targets --apply --operator "deployment:$DEPLOY_IMAGE_TAG"
            echo "Existing plaintext API tokens were revoked by migration and must be regenerated"
            docker compose -f docker-compose.prod.yml run --rm backend python manage.py collectstatic --noinput
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            for attempt in $(seq 1 12); do
              if docker compose -f docker-compose.prod.yml exec -T backend \
                python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/').read()" &&
                curl --fail --silent --show-error "$PUBLIC_HEALTHCHECK_URL"; then
                trap - ERR
                echo "Controlled cutover completed and both health probes passed"
                exit 0
              fi
              sleep 5
            done
            exit 1
          EOF
