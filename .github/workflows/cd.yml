name: Sentinel NOC - CD Production Deployment Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy this exact revision after successful CI and environment approval'
        default: false
        type: boolean

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend
  GATEWAY_IMAGE: ghcr.io/${{ github.repository }}/gateway

jobs:
  release-gate:
    name: Require successful CI for the exact deployment revision
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify CI conclusion for this SHA
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ci.yml', head_sha: context.sha, per_page: 100,
            });
            const { pathToFileURL } = require('node:url');
            const { requireSuccessfulCI } = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/release-gate.mjs`).href);
            requireSuccessfulCI(data.workflow_runs, context.sha,
              `${context.repo.owner}/${context.repo.repo}`);
  # -------------------------------------------------------------
  # 1. BUILD & PUBLISH IMMUTABLE CONTAINER IMAGES
  # -------------------------------------------------------------
  build-and-publish:
    name: Build & Push Production Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags & Labels)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Extract Metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata for Gateway
        id: meta-gateway
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GATEWAY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and Push Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/nginx
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-gateway.outputs.tags }}
          labels: ${{ steps.meta-gateway.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # 2. CONTROLLED CUTOVER DEPLOYMENT
  # -------------------------------------------------------------
  deploy:
    name: Deploy to Production Environment
    needs: [build-and-publish, release-gate]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout Deployment Scripts & Compose
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.PROD_SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_SERVER_USER }}
          PUBLIC_HEALTHCHECK_URL: ${{ secrets.PROD_HEALTHCHECK_URL }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_SSH_HOST"
          test -n "$DEPLOY_USER"
          test -n "$PUBLIC_HEALTHCHECK_URL"

      - name: Setup SSH Deploy Key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.PROD_SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Execute controlled production cutover
        env:
          DEPLOY_SSH_HOST: ${{ secrets.PROD_SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_SERVER_USER }}
          PUBLIC_HEALTHCHECK_URL: ${{ secrets.PROD_HEALTHCHECK_URL }}
        run: |
          DEPLOY_IMAGE_TAG="sha-${GITHUB_SHA:0:7}"
          {
          printf 'sentinel_probe_url=%q\nsentinel_release_tag=%q\n' "$PUBLIC_HEALTHCHECK_URL" "$DEPLOY_IMAGE_TAG"
          cat << 'EOF'
            set -Eeuo pipefail
            cd /opt/sentinel-noc
            set -a
            . ./.env
            set +a
            export PUBLIC_HEALTHCHECK_URL="$sentinel_probe_url" DEPLOY_IMAGE_TAG="$sentinel_release_tag"
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -p backups
            previous_tag="$IMAGE_TAG"

            docker compose -f docker-compose.prod.yml exec -T db \
              pg_dump -Fc -U "$POSTGRES_USER" "$POSTGRES_DB" > "backups/sentinel-$stamp.dump"
            docker compose -f docker-compose.prod.yml exec -T db pg_restore --list \
              < "backups/sentinel-$stamp.dump" > /dev/null
            sha256sum "backups/sentinel-$stamp.dump" > "backups/sentinel-$stamp.dump.sha256"

            rollback() {
              deploy_status=$?
              trap - ERR
              echo "Deployment failed; rolling application images back to $previous_tag"
              if [ "${MIGRATION_IRREVERSIBLE:-false}" = "true" ]; then
                echo "Irreversible migration declared; restoring the pre-deploy database backup"
                sha256sum -c "backups/sentinel-$stamp.dump.sha256"
                docker compose -f docker-compose.prod.yml stop nginx backend celery_worker celery_beat
                docker compose -f docker-compose.prod.yml exec -T db dropdb --force --if-exists -U "$POSTGRES_USER" "$POSTGRES_DB"
                docker compose -f docker-compose.prod.yml exec -T db createdb -U "$POSTGRES_USER" "$POSTGRES_DB"
                docker compose -f docker-compose.prod.yml exec -T db pg_restore --exit-on-error --no-owner --no-acl \
                  -U "$POSTGRES_USER" -d "$POSTGRES_DB" < "backups/sentinel-$stamp.dump"
              fi
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$previous_tag/" .env
              export IMAGE_TAG="$previous_tag"
              docker compose -f docker-compose.prod.yml up -d --remove-orphans
              exit "$deploy_status"
            }
            trap rollback ERR

            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$DEPLOY_IMAGE_TAG/" .env
            export IMAGE_TAG="$DEPLOY_IMAGE_TAG"
            docker compose -f docker-compose.prod.yml pull

            echo "Starting documented cutover window"
            docker compose -f docker-compose.prod.yml stop nginx backend celery_worker celery_beat
            docker compose -f docker-compose.prod.yml run --rm backend python manage.py migrate --noinput
            docker compose -f docker-compose.prod.yml run --rm backend \
              python manage.py quarantine_unsafe_targets --apply --operator "deployment:$DEPLOY_IMAGE_TAG"
            echo "Existing plaintext API tokens were revoked by migration and must be regenerated"
            docker compose -f docker-compose.prod.yml run --rm backend python manage.py collectstatic --noinput
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            for attempt in $(seq 1 12); do
              if docker compose -f docker-compose.prod.yml exec -T backend \
                python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/').read()" &&
                curl --fail --silent --show-error "$PUBLIC_HEALTHCHECK_URL"; then
                trap - ERR
                echo "Controlled cutover completed and both health probes passed"
                exit 0
              fi
              sleep 5
            done
            exit 1
          EOF
          } | ssh "$DEPLOY_USER@$DEPLOY_SSH_HOST" 'bash -s'
