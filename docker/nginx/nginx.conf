user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    # Container-local liveness; public port 80 still redirects to HTTPS.
    server {
        listen 127.0.0.1:8080;
        location = /nginx-health {
            access_log off;
            return 200 'OK';
        }
        location / { return 404; }
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 15M;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;

    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    upstream sentinel_backend {
        server backend:8000;
        keepalive 32;
    }

    upstream sentinel_frontend {
        server frontend:80;
        keepalive 16;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location = /nginx-health {
            access_log off;
            return 200 'OK';
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location ~* ^/admin(/|$) { return 404; }
        location ~* ^/api/v1/platform-admin(/|$) { return 404; }
        location = /api/v1/auth/beta/admin/ { return 404; }
        location = /api/v1/organizations/ { return 404; }
        location ~ "^/api/v1/organizations/[0-9a-fA-F-]{36}/?$" { return 404; }

        location /static/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://sentinel_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location ~ ^/(api/|admin/|health/?) {
            limit_req zone=api_general burst=30 nodelay;
            proxy_pass http://sentinel_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        location = /nginx-health {
            access_log off;
            return 200 'OK';
        }

        location / {
            proxy_pass http://sentinel_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }
    }

    # Published on the host's loopback for a Cloudflare Tunnel with Access enforcement.
    server {
        listen 8081;
        server_name admin.sentinel.gctechops.com;
        absolute_redirect off;
        if ($host != admin.sentinel.gctechops.com) { return 404; }

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        location = / { return 302 /admin/login; }
        location = /admin/login { proxy_pass http://sentinel_frontend; }
        location = /admin/platform { proxy_pass http://sentinel_frontend; }
        location ^~ /assets/ { proxy_pass http://sentinel_frontend; }
        location = /logo.webp { proxy_pass http://sentinel_frontend; }

        location ^~ /api/v1/platform-admin/session/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://sentinel_backend;
        }
        location ^~ /api/v1/platform-admin/ {
            limit_req zone=api_general burst=30 nodelay;
            proxy_pass http://sentinel_backend;
        }
        location = /api/v1/organizations/ { proxy_pass http://sentinel_backend; }
        location ~ "^/api/v1/organizations/[0-9a-fA-F-]{36}/?$" { proxy_pass http://sentinel_backend; }
        location / { return 404; }
    }
}
