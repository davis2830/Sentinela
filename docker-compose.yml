x-runtime-options: &runtime_options
  DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
  EMAIL_RESEND_COOLDOWN_SECONDS: ${EMAIL_RESEND_COOLDOWN_SECONDS:-60}
  EMAIL_RESEND_DAILY_LIMIT: ${EMAIL_RESEND_DAILY_LIMIT:-5}
  JWT_ACCESS_TOKEN_LIFETIME_MINUTES: "15"
  JWT_REFRESH_TOKEN_LIFETIME_DAYS: "7"
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
  BLACKBOX_EXPORTER_URL: ${BLACKBOX_EXPORTER_URL:-http://blackbox_exporter:9115}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
  SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.05}
  SENTINEL_ENV: ${SENTINEL_ENV:-development}
  # Explicit local laboratory control address; remote installs override with HTTPS.
  SENTI9_CONTROL_URL: ${SENTI9_CONTROL_URL:-http://host.docker.internal:8000}
  SENTI9_IMAGE: ${SENTI9_IMAGE:-davis1924/senti9:1.8.0}
  SENTI9_DISTRIBUTION_READY: ${SENTI9_DISTRIBUTION_READY:-false}
  THROTTLE_USER_RATE: ${THROTTLE_USER_RATE:-10000/minute}
  THROTTLE_ANON_RATE: ${THROTTLE_ANON_RATE:-5000/minute}
  DIAGNOSTIC_PER_MINUTE: ${DIAGNOSTIC_PER_MINUTE:-3}
  DIAGNOSTIC_FREE_DAILY: ${DIAGNOSTIC_FREE_DAILY:-20}
  DIAGNOSTIC_PAID_DAILY: ${DIAGNOSTIC_PAID_DAILY:-100}
  DIAGNOSTIC_GLOBAL_PER_MINUTE: ${DIAGNOSTIC_GLOBAL_PER_MINUTE:-60}
  DIAGNOSTIC_MAX_CONCURRENT: ${DIAGNOSTIC_MAX_CONCURRENT:-4}
  DIAGNOSTIC_CACHE_SECONDS: ${DIAGNOSTIC_CACHE_SECONDS:-30}

services:
  db:
    image: postgres:16-alpine
    container_name: sentinel_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      TZ: ${TZ:-America/Guatemala}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinel_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: sentinel_backend
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --reload
    environment:
      <<: *runtime_options
      DIAGNOSTIC_PER_MINUTE: ${DIAGNOSTIC_PER_MINUTE:-3}
      DIAGNOSTIC_FREE_DAILY: ${DIAGNOSTIC_FREE_DAILY:-20}
      DIAGNOSTIC_PAID_DAILY: ${DIAGNOSTIC_PAID_DAILY:-100}
      DIAGNOSTIC_GLOBAL_PER_MINUTE: ${DIAGNOSTIC_GLOBAL_PER_MINUTE:-60}
      DIAGNOSTIC_MAX_CONCURRENT: ${DIAGNOSTIC_MAX_CONCURRENT:-4}
      DIAGNOSTIC_CACHE_SECONDS: ${DIAGNOSTIC_CACHE_SECONDS:-30}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Sentinel <no-reply@example.invalid>}
      BETA_EMAIL_DOMAIN_ALLOWLIST: ${BETA_EMAIL_DOMAIN_ALLOWLIST:-}
      BETA_GLOBAL_SCANS_PER_MINUTE: ${BETA_GLOBAL_SCANS_PER_MINUTE:-120}
      BETA_MAX_PENDING_SCANS: ${BETA_MAX_PENDING_SCANS:-60}
      RETENTION_PLAN_CAP_ENFORCED: ${RETENTION_PLAN_CAP_ENFORCED:-false}
      ENFORCE_LEGACY_EMAIL_VERIFICATION: ${ENFORCE_LEGACY_EMAIL_VERIFICATION:-false}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,host.docker.internal}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-3600}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-false}
      TRUST_X_FORWARDED_PROTO: ${TRUST_X_FORWARDED_PROTO:-false}
      TIME_ZONE: ${TIME_ZONE:-America/Guatemala}
      TZ: ${TZ:-America/Guatemala}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/').read()\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  celery_worker:
    build: ./backend
    container_name: sentinel_celery_worker
    command: celery -A config worker -l info --concurrency=4 -O fair -Q high_priority,monitoring,background,celery --max-tasks-per-child=1000
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$$HOSTNAME --timeout 3 | grep -q pong"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    environment:
      <<: *runtime_options
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Sentinel <no-reply@example.invalid>}
      BETA_EMAIL_DOMAIN_ALLOWLIST: ${BETA_EMAIL_DOMAIN_ALLOWLIST:-}
      BETA_GLOBAL_SCANS_PER_MINUTE: ${BETA_GLOBAL_SCANS_PER_MINUTE:-120}
      BETA_MAX_PENDING_SCANS: ${BETA_MAX_PENDING_SCANS:-60}
      RETENTION_PLAN_CAP_ENFORCED: ${RETENTION_PLAN_CAP_ENFORCED:-false}
      ENFORCE_LEGACY_EMAIL_VERIFICATION: ${ENFORCE_LEGACY_EMAIL_VERIFICATION:-false}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,host.docker.internal}
      TIME_ZONE: ${TIME_ZONE:-America/Guatemala}
      TZ: ${TZ:-America/Guatemala}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: ./backend
    container_name: sentinel_celery_beat
    command: celery -A config beat -l info
    healthcheck:
      # Liveness and broker connectivity; scheduling progress is checked through logs.
      test: ["CMD", "python", "-c", "import os; from config.celery import app; os.kill(1, 0); c = app.connection_for_write(connect_timeout=3); c.ensure_connection(max_retries=0); c.release()"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    environment:
      <<: *runtime_options
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Sentinel <no-reply@example.invalid>}
      BETA_EMAIL_DOMAIN_ALLOWLIST: ${BETA_EMAIL_DOMAIN_ALLOWLIST:-}
      BETA_GLOBAL_SCANS_PER_MINUTE: ${BETA_GLOBAL_SCANS_PER_MINUTE:-120}
      BETA_MAX_PENDING_SCANS: ${BETA_MAX_PENDING_SCANS:-60}
      RETENTION_PLAN_CAP_ENFORCED: ${RETENTION_PLAN_CAP_ENFORCED:-false}
      ENFORCE_LEGACY_EMAIL_VERIFICATION: ${ENFORCE_LEGACY_EMAIL_VERIFICATION:-false}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,host.docker.internal}
      TIME_ZONE: ${TIME_ZONE:-America/Guatemala}
      TZ: ${TZ:-America/Guatemala}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: sentinel_frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  blackbox_exporter:
    image: prom/blackbox-exporter:latest
    container_name: sentinel_blackbox
    ports:
      - "9115:9115"
    volumes:
      - ./docker/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml
    command:
      - --config.file=/etc/blackbox_exporter/config.yml

  loki:
    image: grafana/loki:latest
    container_name: sentinel_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.4.3
    container_name: sentinel_alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      ENVIRONMENT: development
    user: "473:473"
    group_add:
      - "0"
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_positions:/var/lib/alloy/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - loki

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  alloy_positions:
