services:
  nginx:
    image: nginx:1.27-alpine
    container_name: sentinel_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_PATH:?TLS_CERT_PATH required}:/etc/nginx/tls/tls.crt:ro
      - ${TLS_KEY_PATH:?TLS_KEY_PATH required}:/etc/nginx/tls/tls.key:ro
      - django_static:/var/www/static:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      sentinel_internal_net:
        ipv4_address: 172.30.0.10
    security_opt:
      - no-new-privileges:true

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE required}:${IMAGE_TAG:?IMAGE_TAG required}
    container_name: sentinel_frontend_prod
    restart: always
    networks:
      - sentinel_internal_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16-alpine
    container_name: sentinel_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      TZ: ${TZ:-America/Guatemala}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel_internal_net

  redis:
    image: redis:7-alpine
    container_name: sentinel_redis_prod
    restart: always
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    networks:
      - sentinel_internal_net

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE required}:${IMAGE_TAG:?IMAGE_TAG required}
    container_name: sentinel_backend_prod
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 60
    environment: &backend_environment
      DJANGO_SETTINGS_MODULE: config.settings.prod
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Sentinel <no-reply@example.invalid>}
      BETA_EMAIL_DOMAIN_ALLOWLIST: ${BETA_EMAIL_DOMAIN_ALLOWLIST:-}
      BETA_GLOBAL_SCANS_PER_MINUTE: ${BETA_GLOBAL_SCANS_PER_MINUTE:-120}
      BETA_MAX_PENDING_SCANS: ${BETA_MAX_PENDING_SCANS:-60}
      ENFORCE_LEGACY_EMAIL_VERIFICATION: ${ENFORCE_LEGACY_EMAIL_VERIFICATION:-false}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS required}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS required}
      TRUSTED_PROXY_CIDRS: 172.30.0.10/32
      TRUST_X_FORWARDED_PROTO: "true"
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
      SECURE_HSTS_PRELOAD: "true"
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379/1
      BLACKBOX_EXPORTER_URL: http://blackbox:9115
      JWT_ACCESS_TOKEN_LIFETIME_MINUTES: "15"
      JWT_REFRESH_TOKEN_LIFETIME_DAYS: "7"
      TZ: ${TZ:-America/Guatemala}
    volumes:
      - django_static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/').read()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sentinel_internal_net

  celery_worker:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE required}:${IMAGE_TAG:?IMAGE_TAG required}
    container_name: sentinel_celery_worker_prod
    restart: always
    command: celery -A config worker -l info --concurrency=4 -O fair -Q high_priority,monitoring,background,celery --max-tasks-per-child=1000
    environment: *backend_environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinel_internal_net

  celery_beat:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE required}:${IMAGE_TAG:?IMAGE_TAG required}
    container_name: sentinel_celery_beat_prod
    restart: always
    command: celery -A config beat -l info
    environment: *backend_environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinel_internal_net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: sentinel_prometheus_prod
    restart: always
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - sentinel_internal_net

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: sentinel_blackbox_prod
    restart: always
    volumes:
      - ./docker/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - sentinel_internal_net
    security_opt:
      - no-new-privileges:true

  loki:
    image: grafana/loki:3.2.1
    container_name: sentinel_loki_prod
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - sentinel_internal_net
    security_opt:
      - no-new-privileges:true

  alloy:
    image: grafana/alloy:v1.4.3
    container_name: sentinel_alloy_prod
    restart: always
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      ENVIRONMENT: production
    user: "473:473"
    group_add:
      - "0"
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_positions:/var/lib/alloy/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - loki
    networks:
      - sentinel_internal_net

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  alloy_positions:
  django_static:

networks:
  sentinel_internal_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
