services:
  # -------------------------------------------------------------
  # Reverse Proxy & SSL Gateway (OWASP Hardened Nginx)
  # -------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: sentinel_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - django_static:/var/www/static:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend_builder
    networks:
      - sentinel_internal_net

  # -------------------------------------------------------------
  # Frontend Static Bundle Builder (One-shot builder)
  # -------------------------------------------------------------
  frontend_builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel_frontend_builder
    command: sh -c "npm run build && cp -r dist/* /output/"
    volumes:
      - frontend_dist:/output
    networks:
      - sentinel_internal_net

  # -------------------------------------------------------------
  # PostgreSQL 16 + TimescaleDB (Internal Only - No Host Ports)
  # -------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: sentinel_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      TZ: ${TZ:-America/Guatemala}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel_internal_net
    deploy:
      resources:
        limits:
          memory: 2048M

  # -------------------------------------------------------------
  # Redis 7 with Password Protection (Internal Only)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sentinel_redis_prod
    restart: always
    command: >
      redis-server 
      --requirepass "${REDIS_PASSWORD:?Redis password required}"
      --maxmemory 256mb 
      --maxmemory-policy allkeys-lru 
      --save "" 
      --appendonly no
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel_internal_net
    deploy:
      resources:
        limits:
          memory: 384M

  # -------------------------------------------------------------
  # Sentinel Backend API (Gunicorn WSGI - No Reload)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_backend_prod
    restart: always
    command: sh -c "python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 60"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY of at least 50 characters required}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
      SECURE_HSTS_PRELOAD: "true"
      TRUST_X_FORWARDED_PROTO: "true"
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      CONN_MAX_AGE: 60
      JWT_ACCESS_TOKEN_LIFETIME_MINUTES: 15
      JWT_REFRESH_TOKEN_LIFETIME_DAYS: 7
    volumes:
      - django_static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/').read()\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sentinel_internal_net
    deploy:
      resources:
        limits:
          memory: 1536M

  # -------------------------------------------------------------
  # Celery Asynchronous Task Worker
  # -------------------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_celery_worker_prod
    restart: always
    command: celery -A config worker -l info --concurrency=4 -O fair -Q high_priority,monitoring,background,celery --max-tasks-per-child=1000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinel_internal_net
    deploy:
      resources:
        limits:
          memory: 1024M

  # -------------------------------------------------------------
  # Celery Beat Task Scheduler
  # -------------------------------------------------------------
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_celery_beat_prod
    restart: always
    command: celery -A config beat -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinel_internal_net
    deploy:
      resources:
        limits:
          memory: 384M

  # -------------------------------------------------------------
  # Prometheus & Blackbox Exporter (Internal Observability)
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel_prometheus_prod
    restart: always
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
    networks:
      - sentinel_internal_net
    deploy:
      resources:
        limits:
          memory: 512M

  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: sentinel_blackbox_prod
    restart: always
    volumes:
      - ./docker/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - sentinel_internal_net

  loki:
    image: grafana/loki:latest
    container_name: sentinel_loki_prod
    restart: always
    volumes:
      - loki_data:/loki
    networks:
      - sentinel_internal_net
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  django_static:
  frontend_dist:

networks:
  sentinel_internal_net:
    driver: bridge
